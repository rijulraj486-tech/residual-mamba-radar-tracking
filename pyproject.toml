[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-tracking"
version = "0.1.0"
description = "Independent radar-tracking research and evaluation project"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  # The CUDA wheel variant is selected by the installation sequence in README.md.
  "torch==2.4.0",
  "numpy==2.4.4",
  "matplotlib==3.10.8",
  "mamba-ssm==2.2.0",
  "causal-conv1d==1.4.0",
  "tqdm",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["radar_tracking*"]
